name: e2e-emulators

# Сквозной прогон исполнителя на эмуляторах с экранами популярных моделей.
# Эмулятор Google (AOSP + Google APIs): размер экрана и плотность — как у модели, версия Android — как у модели.
# Оболочки производителей (One UI, HyperOS) эмулятор не воспроизводит — их проверяем на реальных телефонах.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Сборка исполнителя и тестового приложения
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :testapp:assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: e2e-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/testapp/build/outputs/apk/debug/testapp-debug.apk
          retention-days: 3

  phone:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Samsung Galaxy S24", api: 34, size: "1080x2340", density: 416 }
          - { name: "Samsung Galaxy S24 Ultra", api: 35, size: "1440x3120", density: 505 }
          - { name: "Samsung Galaxy A54", api: 33, size: "1080x2340", density: 403 }
          - { name: "Samsung Galaxy A12", api: 30, size: "720x1600", density: 264 }
          - { name: "Samsung Galaxy Z Fold6 (внутренний экран)", api: 34, size: "1856x2160", density: 374 }
          - { name: "Xiaomi Redmi Note 13", api: 33, size: "1080x2400", density: 395 }
          - { name: "Google Pixel 8", api: 35, size: "1080x2400", density: 428 }
    name: ${{ matrix.name }} · Android API ${{ matrix.api }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v5
        with:
          name: e2e-apks
          path: apks
      - name: KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Эмулятор и прогон
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          disk-size: 4G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin ${{ matrix.size }}
          script: |
            adb shell wm density ${{ matrix.density }} && adb shell wm size && sleep 3
            adb install -r -g apks/app/build/outputs/apk/debug/app-debug.apk && adb install -r -g apks/testapp/build/outputs/apk/debug/testapp-debug.apk
            node tools/e2e/run.mjs --device "${{ matrix.name }}" --out "e2e-out" || (mkdir -p e2e-out && timeout 120 adb logcat -d -b main,system,crash Pilot:V E2E:S AndroidRuntime:V ActivityManager:I ActivityTaskManager:I AccessibilityManagerService:V '*:W' > e2e-out/logcat.txt; timeout 60 adb shell 'run-as kz.workdesk.ai.pilot sh -c "cat files/journal/*.jsonl"' < /dev/null > e2e-out/journal.jsonl; exit 1)
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-${{ matrix.api }}-${{ strategy.job-index }}
          path: e2e-out/
          retention-days: 14
