name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Тесты моста (включая нагрузку и краш-тесты)
        working-directory: bridge
        run: npm test

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Ключ подписи (только в своём репо, не в PR из форков)
        env:
          PILOT_KEYSTORE_BASE64: ${{ secrets.PILOT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PILOT_KEYSTORE_BASE64" ]; then
            echo "$PILOT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pilot.p12"
            echo "PILOT_KEYSTORE=$RUNNER_TEMP/pilot.p12" >> "$GITHUB_ENV"
            echo "TASKS=assembleRelease" >> "$GITHUB_ENV"
          fi
      - name: Тесты, lint, сборка
        working-directory: android
        env:
          PILOT_KEYSTORE_PASSWORD: ${{ secrets.PILOT_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug ${TASKS:-}
      - name: Проверка подписи релиза
        if: env.TASKS == 'assembleRelease'
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
      - name: Удалить ключ
        if: always()
        run: rm -f "$RUNNER_TEMP/pilot.p12"
      - uses: actions/upload-artifact@v5
        with:
          name: WorkDeskAIPilot-apk
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/reports/lint-results-debug.*
            android/app/build/test-results/**/*.xml
          retention-days: 14
